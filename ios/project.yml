name: ESPLink
options:
  bundleIdPrefix: dev.esplink
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "7"
    CODE_SIGN_STYLE: Automatic
targets:
  ESPLink:
    type: application
    platform: iOS
    sources:
      - path: ESPLink
        excludes:
          - Info.plist
      - path: ../remote/remote.html
        buildPhase: resources
      - path: ../remote/drive.js
        buildPhase: resources
      - path: ../remote/panel.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.esplink.controller
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ESPLink/Info.plist
  ESPLinkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ESPLinkTests
    dependencies:
      - target: ESPLink
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ESPLink:
    build:
      targets:
        ESPLink: all
    test:
      targets:
        - ESPLinkTests
