[platformio]
default_envs = upesy_wroom

[env:upesy_wroom]
platform = espressif32@6.10.0
board = upesy_wroom
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = huge_app.csv
build_flags =
    -D LED_PIN=2
    -D LED_ACTIVE_HIGH=1
    -Wall
    -Wextra

[env:native]
platform = native@1.2.1
test_build_src = no
build_flags = -std=c++11
