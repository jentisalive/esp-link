name: Signed iOS IPA (manual)

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: Explicit App ID from the provisioning profile
        required: true
        default: dev.esplink.controller

permissions:
  contents: read

jobs:
  signed-ios:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      BUNDLE_ID: ${{ inputs.bundle_id }}
      CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Check signing secrets
        shell: bash
        run: |
          test -n "$CERTIFICATE_BASE64" || { echo 'Missing IOS_CERTIFICATE_BASE64'; exit 1; }
          test -n "$PROFILE_BASE64" || { echo 'Missing IOS_PROFILE_BASE64'; exit 1; }
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Import signing identity and profile
        shell: bash
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/signing.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/signing.keychain-db"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/signing.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/signing.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/signing.keychain-db" login.keychain-db
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          python3 scripts/signing_options.py
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Archive signed app
        shell: bash
        run: |
          xcodebuild archive \
            -project ios/ESPLink.xcodeproj -scheme ESPLink \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/ESPLink.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID"
      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ESPLink.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/signed
      - name: Verify exported IPA metadata
        run: python3 scripts/verify_ios_package.py build/signed/*.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ESPLink-iOS-signed
          path: build/signed/*.ipa
          retention-days: 7
      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/ExportOptions.plist"
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
